[tool.poetry]
name = "pipeline"
version = "0.1.0"
description = "Crime heatmap pipeline"
authors = ["Cody Hutchens <chutchens91@gmail.com>"]
packages = [{ include = "pipeline", from = "." }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
prefect = "^3.6.0"
prefect-docker = "^0.6.0"
httpx = "^0.27.0"
geopandas = "^1.0.0"
scipy = "^1.14.0"
rasterio = "^1.4.0"
rio-cogeo = "^5.0.0"
pyproj = "^3.7.0"
pyyaml = "^6.0.0"
boto3 = "^1.35.0"
numpy = "^2.0.0"
shapely = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-httpserver = "^1.1.0"
moto = { version = "^5.0.0", extras = ["s3"] }
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-s"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
