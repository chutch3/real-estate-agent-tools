name: crime-heatmap-pipeline
prefect-version: 3.6.0

build: []

push: []

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: fips-driven
    version: "2.0.0"
    tags: ["crime"]
    description: "Crime heatmap pipeline — discovers counties from backend API"
    schedule: {}

    entrypoint: pipeline/flows/crime_heatmap.py:crime_heatmap_pipeline

    work_pool:
      name: crime-pipeline-docker
      job_variables:
        image: ghcr.io/chutch3/prefect-pipeline-base:latest
        mem_limit: "4g"
        env:
          PREFECT_API_URL: "https://prefect.diyhub.dev/api"
          AWS_ENDPOINT_URL_S3: "https://nas.diyhub.dev:9000"
          CRIME_DATA_S3_BUCKET: real-estate-agent-tools
          AWS_ACCESS_KEY_ID: "admin"
          AWS_SECRET_ACCESS_KEY: "openmediavault"
          BACKEND_URL: "http://192.168.86.24:3000"

  - name: indiana-tax-sync
    version: "1.0.0"
    tags: ["tax", "indiana"]
    description: "Download DLGF Tax Bill data for Clark and Floyd counties and sync to the backend property tax cache"
    schedule: {}

    entrypoint: pipeline/indiana/flows/property_tax.py:indiana_property_tax_sync

    work_pool:
      name: crime-pipeline-docker
      job_variables:
        image: ghcr.io/chutch3/prefect-pipeline-base:latest
        env:
          PREFECT_API_URL: "https://prefect.diyhub.dev/api"
          BACKEND_URL: "http://192.168.86.24:3000"
